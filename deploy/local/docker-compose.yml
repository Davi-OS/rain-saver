# Local integration stack: go-auth-service + rain-saver, each with its own
# Postgres, migrations and dev seed data. Independent from the per-repo
# docker-compose.yml files (different project name, no host DB ports by
# default), so it can run alongside them.
#
#   cd deploy/local && ./build.sh && docker compose up --build -d
#   ./e2e.sh
#   docker compose down -v   # -v also wipes the DBs and the signing key
#
# Binaries are built on the host by build.sh (see why there); images only
# copy them in. AUTH_SERVICE_DIR points at the go-auth-service checkout
# (default: sibling of this repo).
name: rainsaver-local

x-auth-db-env: &auth-db-env
  POSTGRES_HOST: auth-db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: authservice
  POSTGRES_PASSWORD: authservice
  POSTGRES_DB: authservice

services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authservice
      POSTGRES_PASSWORD: authservice
      POSTGRES_DB: authservice
    volumes:
      - auth_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authservice"]
      interval: 2s
      timeout: 3s
      retries: 20

  rs-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rainsaver
      POSTGRES_PASSWORD: rainsaver
      POSTGRES_DB: rainsaver
    volumes:
      - rs_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rainsaver"]
      interval: 2s
      timeout: 3s
      retries: 20

  auth-migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ${AUTH_SERVICE_DIR:-../../../go-auth-service}/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://authservice:authservice@auth-db:5432/authservice?sslmode=disable", "up"]
    depends_on:
      auth-db: {condition: service_healthy}

  rs-migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ../../migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://rainsaver:rainsaver@rs-db:5432/rainsaver?sslmode=disable", "up"]
    depends_on:
      rs-db: {condition: service_healthy}

  # Dev fixture: two INMET stations with synthetic monthly rainfall.
  rs-stations:
    image: postgres:16-alpine
    volumes:
      - ../../scripts/seed_dev_stations.sql:/seed.sql:ro
    command: ["psql", "postgres://rainsaver:rainsaver@rs-db:5432/rainsaver?sslmode=disable", "-v", "ON_ERROR_STOP=1", "-f", "/seed.sql"]
    depends_on:
      rs-migrate: {condition: service_completed_successfully}

  # rain-saver system + "demo" org + dev@rainsaver.local (see cmd/devseed).
  auth-devseed:
    build: {context: .build, args: {BIN: devseed}}
    command: ["-dev"]
    environment:
      <<: *auth-db-env
      DEVSEED_EMAIL: ${DEVSEED_EMAIL:-dev@rainsaver.local}
      DEVSEED_PASSWORD: ${DEVSEED_PASSWORD:-rainsaver-dev-pass}
    depends_on:
      auth-migrate: {condition: service_completed_successfully}

  auth:
    build: {context: .build, args: {BIN: auth-service}}
    environment:
      <<: *auth-db-env
      PORT: "8080"
      # Named volume: the signing key survives restarts, so tokens (and
      # rain-saver's cached JWKS) stay valid across `docker compose restart`.
      AUTH_PRIVATE_KEY_PATH: /app/keys/private_key.pem
      AUTH_KEY_ID: local-1
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      # Browser origins allowed to call the API (comma-separated). Default:
      # the front-end's Vite dev server.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      - auth_keys:/app/keys
    ports:
      - "${AUTH_PORT:-8080}:8080"
    healthcheck:
      # No dedicated health endpoint: JWKS answering means the key is loaded
      # and the HTTP server is up.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/.well-known/jwks.json >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      auth-migrate: {condition: service_completed_successfully}
      auth-devseed: {condition: service_completed_successfully}

  rain-saver:
    build: {context: .build, args: {BIN: rain-saver}}
    environment:
      PORT: "8081"
      POSTGRES_HOST: rs-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: rainsaver
      POSTGRES_PASSWORD: rainsaver
      POSTGRES_DB: rainsaver
      AUTH_SERVICE_BASE_URL: http://auth:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${RAIN_SAVER_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      # rain-saver fetches JWKS at boot and exits if auth is unreachable.
      auth: {condition: service_healthy}
      rs-migrate: {condition: service_completed_successfully}
      rs-stations: {condition: service_completed_successfully}

volumes:
  auth_db:
  rs_db:
  auth_keys:
