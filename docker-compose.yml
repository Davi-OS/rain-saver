services:
  postgres:
    image: postgres:16-alpine
    container_name: rain-saver-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rainsaver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rainsaver}
      POSTGRES_DB: ${POSTGRES_DB:-rainsaver}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rainsaver}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
